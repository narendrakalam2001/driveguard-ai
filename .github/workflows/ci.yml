name: DriveGuard AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src services serving frontend --select E9,F63,F7,F82

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=src --cov=services --cov=serving --cov-report=term-missing

  docker-build:
    name: Docker build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t driveguard-ai:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name driveguard-ci -p 8000:8000 driveguard-ai:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after retries"
          docker logs driveguard-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f driveguard-ci || true

  dashboard-image:
    name: Dashboard image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.dashboard -t driveguard-dashboard:ci .

  model-size-check:
    name: Model size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked model weights stay under 100MB (GitHub file limit)
        run: |
          find models -name "*.pt" -size +100M -print -exec false {} + \
            && echo "No oversized model files tracked in git." \
            || (echo "ERROR: model weights over 100MB must be hosted on HuggingFace Hub, not committed to git." && exit 1)
